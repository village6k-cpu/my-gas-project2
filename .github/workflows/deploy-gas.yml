# Linux와 Windows 회귀 검사가 모두 통과한 main만 GAS에 배포한다.
# endwork.sh의 안전장치(드리프트 가드·백업)를 그대로 따른다 — scripts/ci-deploy-gas.sh 참고.
#
# 1회 설정 (필수): GitHub 레포 Settings → Secrets and variables → Actions 에
#   CLASPRC_JSON = 맥의 ~/.clasprc.json 파일 내용 전체
# 를 등록해야 동작한다. 미등록 시 배포 작업은 명확한 오류로 중단된다.
# (clasp 버전이 맥과 다르면 인증 포맷이 안 맞을 수 있음 — 맥에서 `clasp --version` 확인 후
#  아래 CLASP_VERSION 을 같은 버전으로 맞출 것)

name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "appsscript.json"
      - "scripts/ci-deploy-gas.sh"
      - "scripts/integrate.sh"
      - "scripts/windows/**"
      - "test/**"
      - ".github/workflows/deploy-gas.yml"
  workflow_dispatch:
    inputs:
      skip_drift_guard:
        description: "GAS 드리프트 가드 건너뛰기 (의도된 덮어쓰기일 때만 true)"
        type: boolean
        default: false

concurrency:
  group: deploy-gas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLASP_VERSION: "3.3.0"

jobs:
  test:
    name: 회귀 검사 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/today-dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - name: Python 테스트 의존성 설치
        run: python -m pip install --requirement test/requirements.txt
      - name: 테스트 의존성 설치
        run: npm ci --prefix apps/today-dashboard --ignore-scripts
      - name: 전체 회귀 검사
        shell: bash
        run: |
          mkdir -p test-results
          fails=0
          for f in test/*.test.js; do
            log="test-results/$(basename "$f").log"
            if node "$f" >"$log" 2>&1; then
              echo "PASS: $f"
            else
              fails=1
              echo "::group::FAIL: $f"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          exit "$fails"
      - name: 검사 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-test-logs-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 드리프트 가드가 히스토리 blob 존재 여부로 판별

      - name: 시크릿 확인
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON 시크릿 미등록 — GAS 자동 배포 인증을 설정해야 합니다."
            exit 1
          fi

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: clasp 설치·인증
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm i -g @google/clasp@${{ env.CLASP_VERSION }}
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: GAS 배포 (드리프트 가드 + 백업 포함)
        env:
          SKIP_DRIFT_GUARD: ${{ inputs.skip_drift_guard == true && '1' || '0' }}
        run: |
          chmod +x scripts/ci-deploy-gas.sh
          scripts/ci-deploy-gas.sh "CI deploy ${{ github.sha }}"

      - name: 배포 전 GAS 백업 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-backup-${{ github.run_number }}
          path: gas-backup/
          retention-days: 30
          if-no-files-found: ignore
